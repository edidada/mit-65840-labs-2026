name: MIT 6.5840 Lab5 shardkv
on:
  push:
    branches: [edidada/shardkv1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shardkv:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build daemons
        working-directory: src
        run: |
          go build -race -o main/shardgrp1d main/shardgrp1d.go
          go build -race -o main/kvsrv1d main/kvsrv1d.go
          go build -race -o main/kvraft1d main/kvraft1d.go
      - name: Run official shardkv tests
        working-directory: src/shardkv1
        run: timeout 300 go test -race -count=1 -run 'TestJoinBasic5A' -v -timeout 240s .
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shardkv-results
          path: src/shardkv1/*.go
          if-no-files-found: warn
