name: MIT 6.5840 Lab5 shardkv
on:
  push:
    branches: [edidada/shardkv1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raft-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: src/go.sum
      - name: Run original Raft regression tests
        working-directory: src
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../test-results
          go build -race -o main/raft1d main/raft1d.go
          timeout 3300 go test -race -count=1 -v -timeout 54m ./raft1 2>&1 | tee ../test-results/raft.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raft-regression-results
          path: test-results/
  rsm-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: src/go.sum
      - name: Run original RSM regression tests
        working-directory: src
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../test-results
          go build -race -o main/rsm1d main/rsm1d.go
          timeout 1500 go test -race -count=1 -v -timeout 24m ./kvraft1/rsm 2>&1 | tee ../test-results/rsm.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsm-regression-results
          path: test-results/
  shardkv:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: src/go.sum
      - name: Build daemons
        working-directory: src
        run: |
          go build -race -o main/shardgrp1d main/shardgrp1d.go
          go build -race -o main/kvsrv1d main/kvsrv1d.go
          go build -race -o main/kvraft1d main/kvraft1d.go
      - name: Run targeted migration regressions
        working-directory: src
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../test-results
          timeout 180 go test -race -count=1 -v -timeout 150s -run '^(TestRetiredGroupCacheRefresh|TestMigrationReplayFences)$' ./shardkv1 ./shardkv1/shardgrp 2>&1 | tee ../test-results/migration-regressions.log
      - name: Repeat original stable-shard progress regression
        working-directory: src/shardkv1
        shell: bash
        run: |
          set -o pipefail
          timeout 180 go test -race -count=3 -v -timeout 150s -run '^TestProgressJoin5A$' . 2>&1 | tee ../../test-results/progress-regression.log
      - name: Run official shardkv tests
        working-directory: src/shardkv1
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../test-results
          timeout 4800 go test -race -count=1 -v -timeout 75m ./... 2>&1 | tee ../../test-results/shardkv.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shardkv-results
          path: test-results/
          if-no-files-found: warn
