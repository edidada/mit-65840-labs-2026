name: MIT 6.5840 Lab1 MapReduce
on:
  push:
    branches: [edidada/mapreduce]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mr:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build MapReduce binaries and application plugins
        working-directory: src
        run: |
          set -e
          for app in wc indexer mtiming rtiming jobcount early_exit crash nocrash; do
            go build -buildmode=plugin -o ../mrapps/$app.so mrapps/$app.go
          done
      - name: Run official MapReduce tests
        working-directory: src/mr
        timeout-minutes: 20
        run: timeout 1080 go test -v -count=1 . 
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapreduce-results
          path: |
            src/mr/*.go
            src/mr/mr-*.txt
          if-no-files-found: warn
